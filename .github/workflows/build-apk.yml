name: Build Car Check APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'car-check-fixed.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: ZIP entpacken
        run: |
          unzip -q car-check-fixed.zip
          ls -la car-check
          find car-check -maxdepth 4 -type f | sort

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        working-directory: car-check
        run: gradle assembleDebug --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Car-Check-APK
          path: car-check/app/build/outputs/apk/debug/*.apk
