name: Projekt entpacken

on:
  workflow_dispatch:

jobs:
  unpack:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: ZIP entpacken
        run: |
          unzip -o car-check-fixed.zip
          cp -r car-check/* .
          rm -rf car-check
          rm -f car-check-fixed.zip

      - name: Änderungen speichern
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Projektdateien entpacken" || true
          git push
